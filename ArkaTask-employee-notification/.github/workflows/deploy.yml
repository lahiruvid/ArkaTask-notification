# Starter deploy workflow. Push to main starts it.
# Replace the placeholders before this can assume a real role.
# No static AWS access keys belong in this file.

name: deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # lets GitHub mint the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Repo files are required before Terraform runs.
      - name: Checkout
        uses: actions/checkout@v5

      # GitHub mints the OIDC token. Do not point at a token file.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::034115073932:role/GitHubActionsRole
          aws-region: eu-south-1

      # Install Terraform. Uses the credentials from the step above.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ArkaTask-employee-notification/terraform
        run: terraform init

      - name: Terraform plan
        working-directory: ArkaTask-employee-notification/terraform
        run: terraform plan -var="ami_id=${{ vars.TF_AMI_ID }}" -var="key_name=${{ vars.TF_KEY_NAME }}"

      - name: Terraform apply
        working-directory: ArkaTask-employee-notification/terraform
        run: terraform apply -auto-approve -var="ami_id=${{ vars.TF_AMI_ID }}" -var="key_name=${{ vars.TF_KEY_NAME }}"
