server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/login {
    proxy_pass http://login-service:8081/api/login;
  }

  location /api/cleans {
    proxy_pass http://clean-event-service:8082/api/cleans;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl;
  server_name _;
  root /usr/share/nginx/html;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/login {
    proxy_pass http://login-service:8081/api/login;
  }

  location /api/cleans {
    proxy_pass http://clean-event-service:8082/api/cleans;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
