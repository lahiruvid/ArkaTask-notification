server:
  port: 8083
  shutdown: graceful
spring:
  application:
    name: owner-notifier
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: 5672
    listener:
      simple:
        observation-enabled: true
        # A notice that still fails after 3 tries is dropped instead of looping forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
app:
  login-service-url: ${LOGIN_SERVICE_URL:http://login-service:8081}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
resilience4j:
  retry:
    instances:
      interService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
