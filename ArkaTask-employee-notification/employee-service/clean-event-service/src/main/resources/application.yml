server:
  port: 8082
spring:
  application:
    name: clean-event-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  datasource:
    url: ${SUPABASE_DB_URL:}
    username: ${SUPABASE_DB_USER:}
    password: ${SUPABASE_DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: 5672
app:
  timezone: ${APP_TIMEZONE:Europe/Rome}
  owner-notifier-url: ${OWNER_NOTIFIER_URL:http://owner-notifier:8083}
supabase:
  # Project URL, e.g. https://<project-ref>.supabase.co . JWKS URL and issuer are derived from it.
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  allow-missing-config: ${SUPABASE_ALLOW_MISSING_CONFIG:true}
  jwks-url: ${SUPABASE_JWKS_URL:}
  issuer: ${SUPABASE_JWT_ISSUER:}
  audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  allowed-algs: ${SUPABASE_JWT_ALGS:RS256,ES256}
  clock-skew-seconds: 30
  jwks-min-refresh-seconds: 60
  jwks-startup-attempts: 3
  jwks-retry-seconds: 30
  keys-file: ${SUPABASE_KEYS_FILE:/var/lib/arkatasks/supabase-keys.json}
eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
  health:
    group:
      readiness:
        include: diskSpace
resilience4j:
  retry:
    instances:
      interService:
        max-attempts: 5
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
