server:
  port: 8082
  shutdown: graceful
spring:
  application:
    name: clean-event-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    producer:
      properties:
        # Fail a tap in seconds, not minutes, when Kafka is down.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: clean-event-outbox
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: 5672
    # CleanOutbox waits for the broker's confirm before it marks a row RELAYED.
    publisher-confirm-type: simple
    template:
      observation-enabled: true
app:
  timezone: ${APP_TIMEZONE:Europe/Rome}
  session-file: ${EMPLOYEE_SESSIONS_FILE:/var/lib/arkatasks/employee-sessions.json}
  outbox:
    batch-size: 20
    relay-interval-ms: 5000
    relay-initial-delay-ms: 15000
supabase:
  # Same meaning as in login-service. Both services share the keys file on one volume.
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  allow-missing-config: ${SUPABASE_ALLOW_MISSING_CONFIG:true}
  audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  allowed-algs: ${SUPABASE_JWT_ALGS:RS256,ES256}
  clock-skew-seconds: 30
  jwks-min-refresh-seconds: 60
  jwks-startup-attempts: 3
  jwks-retry-seconds: 30
  keys-file: ${SUPABASE_KEYS_FILE:/var/lib/arkatasks/supabase-keys.json}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
