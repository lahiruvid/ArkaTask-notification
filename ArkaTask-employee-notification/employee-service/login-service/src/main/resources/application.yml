server:
  port: 8081
  shutdown: graceful
spring:
  application:
    name: login-service
app:
  timezone: ${APP_TIMEZONE:Europe/Rome}
  session-file: ${EMPLOYEE_SESSIONS_FILE:/var/lib/arkatasks/employee-sessions.json}
supabase:
  # Public project URL, https://<project-ref>.supabase.co. When set it pins the project:
  # the JWKS URL and token issuer are derived from it and no other project is accepted.
  url: ${SUPABASE_URL:}
  # Public anon or sb_publishable_ key. Used until an employee login saves the keys file.
  # A service_role or sb_secret_ key stops the service at startup.
  anon-key: ${SUPABASE_ANON_KEY:}
  allow-missing-config: ${SUPABASE_ALLOW_MISSING_CONFIG:true}
  audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  allowed-algs: ${SUPABASE_JWT_ALGS:RS256,ES256}
  clock-skew-seconds: 30
  jwks-min-refresh-seconds: 60
  jwks-startup-attempts: 3
  jwks-retry-seconds: 30
  keys-file: ${SUPABASE_KEYS_FILE:/var/lib/arkatasks/supabase-keys.json}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
resilience4j:
  ratelimiter:
    configs:
      per-phone:
        limit-for-period: 10
        limit-refresh-period: 15m
        timeout-duration: 0s
    instances:
      # Template for the one limiter per phone number in PhoneLoginLimiter.
      per-phone:
        base-config: per-phone
