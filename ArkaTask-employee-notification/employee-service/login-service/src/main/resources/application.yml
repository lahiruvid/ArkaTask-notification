server:
  port: 8081
spring:
  application:
    name: login-service
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db:5432/arkatasks}
    username: ${SUPABASE_DB_USER:arkatasks}
    password: ${SUPABASE_DB_PASSWORD:arkatasks}
app:
  timezone: ${APP_TIMEZONE:Europe/Rome}
  clean-event-url: ${CLEAN_EVENT_URL:http://clean-event-service:8082}
supabase:
  # Project URL, e.g. https://<project-ref>.supabase.co . JWKS URL and issuer are derived from it.
  url: ${SUPABASE_URL:}
  jwks-url: ${SUPABASE_JWKS_URL:}
  issuer: ${SUPABASE_JWT_ISSUER:}
  audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  allowed-algs: ${SUPABASE_JWT_ALGS:RS256,ES256}
  clock-skew-seconds: 30
  jwks-min-refresh-seconds: 60
  jwks-startup-attempts: 3
  jwks-retry-seconds: 30
  keys-file: ${SUPABASE_KEYS_FILE:/var/lib/arkatasks/supabase-keys.json}
eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
  health:
    group:
      readiness:
        include: db,diskSpace
resilience4j:
  ratelimiter:
    configs:
      per-phone:
        # Disabled in PhoneLoginLimiter. These values are not enforced.
        limit-for-period: 100000
        limit-refresh-period: 1s
        timeout-duration: 0s
    instances:
      # Disabled on POST /api/login. These values are not enforced.
      login:
        limit-for-period: 100000
        limit-refresh-period: 1s
        timeout-duration: 0s
      # Copied onto one limiter per phone number.
      per-phone:
        base-config: per-phone
  retry:
    instances:
      interService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientException
