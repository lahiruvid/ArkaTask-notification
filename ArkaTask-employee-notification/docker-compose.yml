# Container limits sum to about 5 GB. Jenkins (768 MB heap) and Ubuntu fit in the 12 GB A1 VM.
name: arkatasks

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    pull_policy: if_not_present
    environment:
      POSTGRES_USER: arkatasks
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arkatasks}
      POSTGRES_DB: arkatasks
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/clean_outbox.sql:/docker-entrypoint-initdb.d/01-outbox.sql:ro

  kafka:
    image: bitnamilegacy/kafka:3.7.0
    restart: unless-stopped
    mem_limit: 768m
    pull_policy: if_not_present
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafkadata:/bitnami/kafka

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    mem_limit: 512m
    pull_policy: if_not_present

  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    mem_limit: 384m
    pull_policy: if_not_present
    environment:
      JAVA_OPTS: "-Xmx128m -XX:+ExitOnOutOfMemoryError"
    ports:
      - "127.0.0.1:9411:9411"

  eureka:
    build: ./employee-service/eureka-server
    restart: unless-stopped
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m"

  login-service:
    build: ./employee-service/login-service
    restart: unless-stopped
    mem_limit: 640m
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/arkatasks
      SUPABASE_DB_USER: arkatasks
      SUPABASE_DB_PASSWORD: ${DB_PASSWORD:-arkatasks}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL=https://<project-ref>.supabase.co in .env or the environment}
      SUPABASE_KEYS_FILE: /var/lib/arkatasks/supabase-keys.json
      APP_TIMEZONE: Europe/Rome
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    volumes:
      - supabase-runtime:/var/lib/arkatasks
    depends_on:
      db:
        condition: service_started
      eureka:
        condition: service_started
    ports:
      - "127.0.0.1:18081:8081"

  clean-event-service:
    build: ./employee-service/clean-event-service
    restart: unless-stopped
    mem_limit: 640m
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/arkatasks
      SUPABASE_DB_USER: arkatasks
      SUPABASE_DB_PASSWORD: ${DB_PASSWORD:-arkatasks}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL=https://<project-ref>.supabase.co in .env or the environment}
      SUPABASE_KEYS_FILE: /var/lib/arkatasks/supabase-keys.json
      KAFKA_BOOTSTRAP: kafka:9092
      RABBIT_HOST: rabbitmq
      APP_TIMEZONE: Europe/Rome
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    volumes:
      - supabase-runtime:/var/lib/arkatasks
    depends_on:
      db:
        condition: service_started
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
      eureka:
        condition: service_started
    ports:
      - "127.0.0.1:18082:8082"

  owner-notifier:
    build: ./owner-notifier
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBIT_HOST: rabbitmq
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      rabbitmq:
        condition: service_started
      eureka:
        condition: service_started

  nginx:
    build:
      context: ..
      dockerfile: ArkaTask-employee-notification/Dockerfile.frontend
    restart: unless-stopped
    mem_limit: 128m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/nginx/certs
        if [ ! -f /etc/nginx/certs/tls.crt ]; then
          apk add --no-cache openssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout /etc/nginx/certs/tls.key \
            -out /etc/nginx/certs/tls.crt \
            -subj "/CN=localhost"
        fi
        exec nginx -g "daemon off;"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginxcerts:/etc/nginx/certs
    depends_on:
      - login-service
      - clean-event-service
    ports:
      - "80:80"
      - "443:443"

volumes:
  # Holds supabase-keys.json (Supabase URL + anon key, mode 600). Shared by login and clean-event.
  supabase-runtime:
  pgdata:
  kafkadata:
  nginxcerts:
