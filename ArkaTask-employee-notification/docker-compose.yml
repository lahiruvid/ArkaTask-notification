services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arkatasks
      POSTGRES_PASSWORD: arkatasks
      POSTGRES_DB: arkatasks
    volumes:
      - ./supabase/clean_outbox.sql:/docker-entrypoint-initdb.d/01-outbox.sql:ro
    ports:
      - "5432:5432"

  kafka:
    image: bitnamilegacy/kafka:3.7.0
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  rabbitmq:
    image: rabbitmq:3-alpine
    ports:
      - "5672:5672"

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"

  eureka:
    build: ./employee-service/eureka-server
    ports:
      - "8761:8761"

  login-service:
    build: ./employee-service/login-service
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/arkatasks
      SUPABASE_DB_USER: arkatasks
      SUPABASE_DB_PASSWORD: arkatasks
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL=https://<project-ref>.supabase.co in .env or the environment}
      SUPABASE_KEYS_FILE: /var/lib/arkatasks/supabase-keys.json
      APP_TIMEZONE: Europe/Rome
    volumes:
      - supabase-runtime:/var/lib/arkatasks
    depends_on:
      db:
        condition: service_started
      eureka:
        condition: service_started
    ports:
      - "127.0.0.1:18081:8081"

  clean-event-service:
    build: ./employee-service/clean-event-service
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/arkatasks
      SUPABASE_DB_USER: arkatasks
      SUPABASE_DB_PASSWORD: arkatasks
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL=https://<project-ref>.supabase.co in .env or the environment}
      SUPABASE_KEYS_FILE: /var/lib/arkatasks/supabase-keys.json
      KAFKA_BOOTSTRAP: kafka:9092
      RABBIT_HOST: rabbitmq
      APP_TIMEZONE: Europe/Rome
    volumes:
      - supabase-runtime:/var/lib/arkatasks
    depends_on:
      db:
        condition: service_started
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
      eureka:
        condition: service_started
    ports:
      - "127.0.0.1:18082:8082"

  owner-notifier:
    build: ./owner-notifier
    environment:
      RABBIT_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_started
      eureka:
        condition: service_started
    ports:
      - "8083:8083"

  nginx:
    build:
      context: ..
      dockerfile: ArkaTask-employee-notification/Dockerfile.frontend
    image: arkatasks-nginx:local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/nginx/certs
        if [ ! -f /etc/nginx/certs/tls.crt ]; then
          apk add --no-cache openssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout /etc/nginx/certs/tls.key \
            -out /etc/nginx/certs/tls.crt \
            -subj "/CN=localhost"
        fi
        exec nginx -g "daemon off;"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - login-service
      - clean-event-service
    ports:
      - "8880:80"
      - "8443:443"

volumes:
  # Holds supabase-keys.json (Supabase URL + anon key, mode 600). Shared by login and clean-event.
  supabase-runtime:
