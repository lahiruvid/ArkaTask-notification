# ArkaTasks employee stack for the Oracle Always Free A1 VM (linux/arm64, 2 OCPU, 12 GB).
# Supabase is the database and the web UI is on Cloudflare, so neither runs here.
# Only Nginx is public (80/443). Service ports are bound to 127.0.0.1 for health checks and E2E.
# Memory limits add up to about 3.6 GB. Jenkins (about 1 GB), Docker builds, and Ubuntu use the
# rest of the 12 GB, and bootstrap adds 2 GB of swap.
#
# On the VM, images come from Docker Hub (docker-compose.registry.yml). Locally:
#   docker compose up -d --build
name: arkatasks

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-java-healthcheck: &java-healthcheck
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 120s

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      # Heap well under the container limit: the broker was OOM-killed before with a 512 MB heap
      # in 768 MB. Off-heap (metaspace, direct buffers, page cache) needs the remainder.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
      KAFKA_OPTS: -XX:+ExitOnOutOfMemoryError -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=128m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # A TCP probe. kafka-*.sh tools start a second JVM inside the same memory limit.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4.1-alpine
    # Fixed node name, so the durable queue in the volume survives a container rebuild.
    hostname: rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      JAVA_OPTS: -Xms64m -Xmx160m -XX:+ExitOnOutOfMemoryError
      # In-memory storage. The default keeps 500k spans, which outgrows this limit.
      MEM_MAX_SPANS: "20000"
    ports:
      - "127.0.0.1:9411:9411"

  eureka:
    build: ./employee-service/eureka-server
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8761/actuator/health"]

  login-service:
    build: ./employee-service/login-service
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    environment:
      # Public values only. SUPABASE_URL pins the project; both may stay empty, in which case the
      # first verified employee login saves them in the supabase-runtime volume.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Rome}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    volumes:
      - supabase-runtime:/var/lib/arkatasks
    depends_on:
      eureka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]

  clean-event-service:
    build: ./employee-service/clean-event-service
    restart: unless-stopped
    mem_limit: 576m
    logging: *logging
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Rome}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx288m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    volumes:
      - supabase-runtime:/var/lib/arkatasks
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:8082"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health"]

  owner-notifier:
    build: ./owner-notifier
    restart: unless-stopped
    mem_limit: 448m
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx224m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:8083"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/actuator/health"]

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    environment:
      # "*" is safe here: the API uses bearer tokens, not cookies. Set your Cloudflare Pages
      # origin (https://<app>.pages.dev) in .env to lock it down.
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
      NGINX_ENVSUBST_FILTER: ^CORS_
      # Changes when nginx/ changes, so compose recreates the container with the new config.
      NGINX_CONF_HASH: ${NGINX_CONF_HASH:-}
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      login-service:
        condition: service_healthy
      clean-event-service:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  kafka-data:
  rabbitmq-data:
  # supabase-keys.json (URL + anon key) and employee-sessions.json, shared by login and clean-event.
  supabase-runtime:
