# Deploy the employee stack to the Oracle Always Free Ampere VM on every push to deploy-oci.
#
#   secrets  - fails in seconds if a required secret is missing or still "pending"
#   verify   - Maven tests, frontend build, and static checks (no secrets, no images)
#   deploy   - Terraform keeps the VM in place, then SSH (SSH_PRIVATE_KEY) checks out the pushed
#              commit on the VM (GH_TOKEN) and hands over to Jenkins, which builds the linux/arm64
#              images, pushes them to Docker Hub (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN), and runs
#              docker compose. Images are never built here.

name: deploy-oci

on:
  push:
    branches:
      - deploy-oci
  workflow_dispatch:

concurrency:
  group: deploy-oci
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secrets:
    name: Check secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail fast on missing or pending secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_SSH_CIDR: ${{ secrets.OCI_SSH_CIDR }}
          OCI_AVAILABILITY_DOMAIN_INDEX: ${{ secrets.OCI_AVAILABILITY_DOMAIN_INDEX }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_NAMESPACE: ${{ secrets.TF_STATE_NAMESPACE }}
          JENKINS_ADMIN_PASSWORD: ${{ secrets.JENKINS_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            SSH_PRIVATE_KEY GH_TOKEN DOCKERHUB_USERNAME DOCKERHUB_TOKEN
            OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_REGION
            OCI_COMPARTMENT_OCID OCI_SSH_PUBLIC_KEY OCI_SSH_CIDR
            TF_STATE_BUCKET TF_STATE_NAMESPACE JENKINS_ADMIN_PASSWORD
          )
          missing=()
          pending=()
          for name in "${required[@]}"; do
            value="$(printf '%s' "${!name:-}" | tr -d '[:space:]')"
            if [ -z "$value" ]; then
              missing+=("$name")
            elif [ "$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')" = "pending" ]; then
              pending+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ] || [ "${#pending[@]}" -gt 0 ]; then
            [ "${#missing[@]}" -gt 0 ] && echo "::error::Missing GitHub secrets: ${missing[*]}"
            [ "${#pending[@]}" -gt 0 ] && echo "::error::Secrets still set to the placeholder 'pending': ${pending[*]}"
            echo "Set real values under Settings > Secrets and variables > Actions."
            echo "Names and formats: ArkaTask-employee-notification/terraform-oci/README.md."
            echo "Stopping before Terraform and SSH."
            exit 1
          fi
          fail() { echo "::error::$1"; exit 1; }
          case "$SSH_PRIVATE_KEY" in *"PRIVATE KEY"*) ;; *) fail "SSH_PRIVATE_KEY must be an OpenSSH or PEM private key" ;; esac
          case "$OCI_PRIVATE_KEY" in *"PRIVATE KEY"*) ;; *) fail "OCI_PRIVATE_KEY must be a PEM private key" ;; esac
          case "$OCI_SSH_PUBLIC_KEY" in ssh-*|ecdsa-*) ;; *) fail "OCI_SSH_PUBLIC_KEY must be an OpenSSH public key" ;; esac
          case "$JENKINS_ADMIN_PASSWORD" in *$'\n'*|*$'\r'*) fail "JENKINS_ADMIN_PASSWORD must be a single line" ;; esac
          [ "${#JENKINS_ADMIN_PASSWORD}" -ge 8 ] || fail "JENKINS_ADMIN_PASSWORD must be at least 8 characters"
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]{4,30}$ ]] || fail "DOCKERHUB_USERNAME must be the lowercase Docker Hub user name"
          case "${OCI_AVAILABILITY_DOMAIN_INDEX:-0}" in 0|1|2) ;; *) fail "OCI_AVAILABILITY_DOMAIN_INDEX must be 0, 1, or 2" ;; esac
          echo "All required secrets are set."

      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the optional Supabase values (public URL and anon key only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 ArkaTask-employee-notification/deploy/check-supabase-keys.py

      - name: Check that GH_TOKEN can read this commit (GitHub API)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if ! sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .sha)"; then
            echo "::error::GH_TOKEN cannot read ${GITHUB_REPOSITORY}. Use a token with repo (contents: read) access."
            exit 1
          fi
          test "$sha" = "$GITHUB_SHA"

  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ArkaTask-employee-notification/**/pom.xml

      - name: Maven verify (four services)
        working-directory: ArkaTask-employee-notification
        run: |
          set -euo pipefail
          for module in employee-service/eureka-server employee-service/login-service \
                        employee-service/clean-event-service owner-notifier; do
            echo "::group::mvn verify ${module}"
            mvn -B -ntp -f "${module}/pom.xml" verify
            echo "::endgroup::"
          done

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Frontend lint and static export
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Compose, shell, and Python checks
        working-directory: ArkaTask-employee-notification
        env:
          DOCKERHUB_USERNAME: ci-check
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.registry.yml config --quiet
          shellcheck -x -P SCRIPTDIR/.. deploy/*.sh terraform-oci/bootstrap.sh
          python3 -m py_compile deploy/*.py e2e/test_stack.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.13.0"
          terraform_wrapper: false

      - name: Terraform fmt and validate (no backend, no credentials)
        working-directory: ArkaTask-employee-notification/terraform-oci
        run: |
          set -euo pipefail
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    name: Terraform, SSH, Jenkins
    needs: [secrets, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write the OCI API key and the deploy SSH key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          def write(env_name, path):
              raw = os.environ[env_name]
              # A one-line GitHub secret stores the PEM line breaks as the two characters \ and n.
              if "\\n" in raw and raw.count("\n") <= 1:
                  raw = raw.replace("\\n", "\n")
              raw = raw.strip() + "\n"
              path.parent.mkdir(mode=0o700, exist_ok=True)
              path.write_text(raw)
              path.chmod(0o600)

          write("OCI_PRIVATE_KEY", Path.home() / ".oci" / "oci_api_key.pem")
          write("SSH_PRIVATE_KEY", Path.home() / ".ssh" / "oci_deploy")
          PY
          # Terraform installs OCI_SSH_PUBLIC_KEY on the VM; it must be the public half of SSH_PRIVATE_KEY.
          derived="$(ssh-keygen -y -f "$HOME/.ssh/oci_deploy" | awk '{ print $1 " " $2 }')"
          expected="$(printf '%s' "$OCI_SSH_PUBLIC_KEY" | awk '{ print $1 " " $2 }')"
          if [ "$derived" != "$expected" ]; then
            echo "::error::OCI_SSH_PUBLIC_KEY is not the public key of SSH_PRIVATE_KEY. They must be one key pair."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.13.0"
          terraform_wrapper: false

      - name: Terraform init, plan, and apply
        id: terraform
        working-directory: ArkaTask-employee-notification/terraform-oci
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_SSH_CIDR: ${{ secrets.OCI_SSH_CIDR }}
          OCI_AVAILABILITY_DOMAIN_INDEX: ${{ secrets.OCI_AVAILABILITY_DOMAIN_INDEX }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_NAMESPACE: ${{ secrets.TF_STATE_NAMESPACE }}
        run: |
          set -euo pipefail
          key_file="${HOME}/.oci/oci_api_key.pem"
          export TF_VAR_tenancy_ocid="$OCI_TENANCY_OCID"
          export TF_VAR_user_ocid="$OCI_USER_OCID"
          export TF_VAR_fingerprint="$OCI_FINGERPRINT"
          export TF_VAR_region="$OCI_REGION"
          export TF_VAR_compartment_ocid="$OCI_COMPARTMENT_OCID"
          export TF_VAR_ssh_public_key="$OCI_SSH_PUBLIC_KEY"
          export TF_VAR_ssh_cidr="$OCI_SSH_CIDR"
          export TF_VAR_private_key
          TF_VAR_private_key="$(cat "$key_file")"
          if [ -n "${OCI_AVAILABILITY_DOMAIN_INDEX:-}" ]; then
            export TF_VAR_availability_domain_index="$OCI_AVAILABILITY_DOMAIN_INDEX"
          fi
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="namespace=${TF_STATE_NAMESPACE}" \
            -backend-config="region=${OCI_REGION}" \
            -backend-config="auth=APIKey" \
            -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" \
            -backend-config="user_ocid=${OCI_USER_OCID}" \
            -backend-config="fingerprint=${OCI_FINGERPRINT}" \
            -backend-config="private_key_path=${key_file}"
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
          rm -f tfplan
          ip="$(terraform output -raw public_ip)"
          test -n "$ip"
          echo "public_ip=${ip}" >> "$GITHUB_OUTPUT"

      - name: Wait for the VM bootstrap
        env:
          PUBLIC_IP: ${{ steps.terraform.outputs.public_ip }}
        run: |
          set -euo pipefail
          ssh_base=(ssh -i "$HOME/.ssh/oci_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
                    -o ConnectTimeout=10 -o ServerAliveInterval=30 "ubuntu@${PUBLIC_IP}")
          for attempt in $(seq 1 150); do
            if "${ssh_base[@]}" "test -f /var/lib/arkatasks-bootstrap.done"; then
              echo "bootstrap finished"
              exit 0
            fi
            echo "waiting for the bootstrap marker (${attempt}/150)"
            sleep 10
          done
          "${ssh_base[@]}" "tail -n 120 /var/log/arkatasks-bootstrap.log" || true
          echo "::error::The VM did not finish bootstrap within 25 minutes. See /var/log/arkatasks-bootstrap.log."
          exit 1

      - name: Pull the pushed commit on the VM and run Jenkins
        env:
          PUBLIC_IP: ${{ steps.terraform.outputs.public_ip }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          JENKINS_ADMIN_PASSWORD: ${{ secrets.JENKINS_ADMIN_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          q() { printf '%q' "$1"; }
          # Values travel on the SSH session's stdin, never on a command line. printf %q quotes them.
          # The heredoc is expanded here on purpose (escaped \$ parts run on the VM).
          # shellcheck disable=SC2087
          ssh -i "$HOME/.ssh/oci_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 "ubuntu@${PUBLIC_IP}" bash -s <<REMOTE
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          # GH_TOKEN authenticates the fetch through git's environment config. It is not saved in .git/config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic \$(printf 'x-access-token:%s' $(q "$GH_TOKEN") | base64 -w0)"
          cd /opt/arkatasks
          if [ ! -d .git ]; then
            git init --quiet
          fi
          git remote remove origin 2>/dev/null || true
          git remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git fetch --quiet --depth 1 origin ${GITHUB_SHA}
          git checkout --quiet --force --detach FETCH_HEAD
          # Drop files deleted in git. Ignored files (.env) stay.
          git clean -fdq
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          echo "VM is at \$(git rev-parse --short=12 HEAD)"
          export JENKINS_ADMIN_PASSWORD=$(q "$JENKINS_ADMIN_PASSWORD")
          export DOCKERHUB_USERNAME=$(q "$DOCKERHUB_USERNAME")
          export DOCKERHUB_TOKEN=$(q "$DOCKERHUB_TOKEN")
          export SUPABASE_URL=$(q "${SUPABASE_URL:-}")
          export SUPABASE_ANON_KEY=$(q "${SUPABASE_ANON_KEY:-}")
          bash /opt/arkatasks/ArkaTask-employee-notification/deploy/vm-jenkins-deploy.sh < /dev/null
          REMOTE

      - name: Public health check
        env:
          PUBLIC_IP: ${{ steps.terraform.outputs.public_ip }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "http://${PUBLIC_IP}/actuator/health"
          echo
          ssh -i "$HOME/.ssh/oci_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "ubuntu@${PUBLIC_IP}" \
            "cd /opt/arkatasks/ArkaTask-employee-notification && docker compose -f docker-compose.yml -f docker-compose.registry.yml ps"
